<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ifrmae tag</title>
  </head>
  <body>
    <h1>use cases of an iframe tag</h1>
    <p>how we embded google maps into website</p>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31019.09957740057!2d79.39661589694617!3d13.634179901692686!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a4d4b0f88620427%3A0xcf4152d1daca0cac!2sTirupati%2C%20Andhra%20Pradesh!5e0!3m2!1sen!2sin!4v1781168058165!5m2!1sen!2sin"
      width="800"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>

    <p>how we can embed an video</p>
    <iframe
      width="800"
      height="400"
      src="https://www.youtube.com/embed/RgV57kDzcng"
      title="Sundar Pichai on A.I. Backlash, the Future of Work and Google’s Next Era"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <p>how we can embed an playlist</p>
    <iframe
      width="800"
      height="400"
      src="https://www.youtube.com/embed/Ihy0QziLDf0?si=h2dm9FaXA3Cyi5-C"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <p>how we can embed a website</p>
    <iframe
      src="https://www.flipkart.com"
      width="800"
      height="400"
      frameborder="0"
      >flipkart offcial website</iframe
    >
  </body>
</html>
